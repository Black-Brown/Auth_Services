[package]
name = "auth_services"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"

# Base de datos SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }

# seguridad (emgriptar contrase;as y crear tokens de sesion)
argon2 = "0.5"
jsonwebtoken = "9"
chrono = "0.4"
