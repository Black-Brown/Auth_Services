[package]
name = "auth_services"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"

# Base de datos SQLite
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }

# seguridad (emgriptar contrase;as y crear tokens de sesion)
argon2 = "0.6"
jsonwebtoken = "12"
chrono = "0.4"
